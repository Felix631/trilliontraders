<html lang="en" dir="auto" class="light">

        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="<%= assetPrefix %>/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Poppins is the brand font (see brand.config.json -> typography.font_family.primary) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <meta name="title" content="TrillionTraders" />
        <meta
            name="description"
            content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!"
        />
        <meta property="og:title" content="TrillionTraders" />
        <meta
            property="og:description"
            content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!"
        />
        <title>TrillionTraders</title>
        <style>
            :root {
                font-size: 62.5%;
            }
            /*
             * Pre-React cover only — the Aurora Deep canvas the app itself uses
             * (ink #050b1c under the blue → cyan → emerald spectrum) plus the same
             * loading card the React splash renders (src/components/loader/chunk-loader.tsx),
             * so the handover between the two is invisible. Inline because there is no
             * stylesheet yet, and no brand title flash before the app mounts.
             */
            #df-boot-splash {
                position: fixed;
                inset: 0;
                z-index: 99999;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Poppins, 'DM Sans', system-ui, -apple-system, sans-serif;
                background:
                    radial-gradient(1100px 650px at 18% 8%, rgba(37, 99, 235, 0.42), transparent 62%),
                    radial-gradient(950px 600px at 84% 88%, rgba(16, 185, 129, 0.34), transparent 64%),
                    radial-gradient(900px 560px at 58% 42%, rgba(34, 211, 238, 0.2), transparent 62%),
                    #050b1c;
            }
            /* Vignette that focuses the card. */
            #df-boot-splash::after {
                content: '';
                position: absolute;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(120% 90% at 50% 50%, transparent 45%, rgba(2, 6, 23, 0.72) 100%);
            }
            #df-boot-splash[data-done='1'] {
                display: none;
            }
            .df-boot-card {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                width: min(46rem, calc(100vw - 3.2rem));
                padding: 2.6rem 2.8rem 2.2rem;
                border: 1px solid rgba(148, 197, 255, 0.18);
                border-radius: 2.2rem;
                background: linear-gradient(160deg, rgba(15, 28, 55, 0.94), rgba(5, 11, 28, 0.96));
                box-shadow:
                    0 2.4rem 6rem rgba(2, 6, 23, 0.65),
                    inset 0 0.1rem 0 rgba(255, 255, 255, 0.06);
                color: #e8f1ff;
                text-align: left;
            }
            .df-boot-brand {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.2rem;
            }
            .df-boot-name {
                display: inline-flex;
                align-items: center;
                gap: 1rem;
                color: #f8fbff;
                font-size: 1.6rem;
                font-weight: 700;
                letter-spacing: 0.01em;
            }
            .df-boot-badge {
                display: inline-grid;
                place-items: center;
                width: 3.2rem;
                height: 3.2rem;
                border-radius: 1rem;
                background: linear-gradient(140deg, #2563eb, #22d3ee);
                color: #041022;
                font-size: 1.7rem;
                font-weight: 800;
            }
            .df-boot-live {
                display: inline-flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.35rem 0.9rem;
                border: 1px solid rgba(16, 185, 129, 0.42);
                border-radius: 999rem;
                background: rgba(16, 185, 129, 0.12);
                color: #6ee7b7;
                font-size: 1.05rem;
                font-weight: 800;
                letter-spacing: 0.14em;
            }
            .df-boot-live i {
                width: 0.7rem;
                height: 0.7rem;
                border-radius: 50%;
                background: #34d399;
                animation: df-boot-pulse 1.8s ease-out infinite;
            }
            .df-boot-divider {
                height: 1px;
                margin: 1.8rem 0;
                background: linear-gradient(90deg, transparent, rgba(148, 197, 255, 0.35), transparent);
            }
            .df-boot-title {
                margin: 0;
                font-size: 2.1rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                background: linear-gradient(92deg, #dbeafe, #7dd3fc 45%, #6ee7b7);
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .df-boot-sub {
                margin: 0.6rem 0 0;
                font-size: 1.25rem;
                color: #9fb6d8;
            }
            .df-boot-bar {
                position: relative;
                height: 0.7rem;
                margin-top: 2rem;
                overflow: hidden;
                border-radius: 999rem;
                background: rgba(148, 197, 255, 0.16);
            }
            .df-boot-bar i {
                display: block;
                width: 3%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #2563eb, #22d3ee, #10b981);
                box-shadow: 0 0 1.4rem rgba(34, 211, 238, 0.5);
                /* Creeps up on its own until the counted percentage takes over. */
                animation: df-boot-fill 3.2s ease-out forwards;
            }
            .df-boot-steps {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                margin: 1.8rem 0 0;
                padding: 0;
                list-style: none;
            }
            .df-boot-step {
                display: flex;
                align-items: center;
                gap: 1rem;
                color: #7f95b8;
                font-size: 1.2rem;
            }
            .df-boot-step--current {
                color: #eaf3ff;
                font-weight: 600;
            }
            .df-boot-step-mark {
                display: inline-grid;
                flex: 0 0 auto;
                place-items: center;
                width: 1.6rem;
                height: 1.6rem;
                border: 1px solid rgba(148, 197, 255, 0.35);
                border-radius: 50%;
            }
            .df-boot-step--current .df-boot-step-mark {
                border-color: #22d3ee;
                animation: df-boot-pulse 1.8s ease-out infinite;
            }
            .df-boot-footer {
                margin: 1.8rem 0 0;
                color: #8ea6c9;
                font-size: 1.05rem;
                text-align: center;
            }
            @keyframes df-boot-pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
                }
                70% {
                    box-shadow: 0 0 0 1.1rem rgba(52, 211, 153, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
                }
            }
            @keyframes df-boot-fill {
                from {
                    width: 3%;
                }
                to {
                    width: 22%;
                }
            }
            @media (max-width: 480px) {
                .df-boot-card {
                    padding: 2rem 1.8rem 1.6rem;
                }
                .df-boot-title {
                    font-size: 1.8rem;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .df-boot-live i,
                .df-boot-bar i {
                    animation: none;
                }
            }
        </style>
    </head>

    <body class="body theme theme--light">
        <!-- Google Tag Manager (noscript) -->
        <noscript
            ><iframe
                src="https://www.googletagmanager.com/ns.html?id=GTM-KV9538TF"
                height="0"
                width="0"
                style="display: none; visibility: hidden"
            ></iframe
        ></noscript>
        <!-- End Google Tag Manager (noscript) -->

        <div id="df-boot-splash" aria-hidden="true">
            <div class="df-boot-card">
                <div class="df-boot-brand">
                    <span class="df-boot-name"><span class="df-boot-badge">T</span>Trillion Trades</span>
                    <span class="df-boot-live"><i></i>LIVE</span>
                </div>
                <span class="df-boot-divider"></span>
                <h1 class="df-boot-title">Welcome to Trillion Trades</h1>
                <p class="df-boot-sub">Synthetic indices, trading bots and live charts in one hub.</p>
                <span class="df-boot-bar"><i></i></span>
                <ul class="df-boot-steps">
                    <li class="df-boot-step df-boot-step--current">
                        <span class="df-boot-step-mark"></span>Connecting to the server
                    </li>
                    <li class="df-boot-step"><span class="df-boot-step-mark"></span>Loading your workspace</li>
                    <li class="df-boot-step">
                        <span class="df-boot-step-mark"></span>Loading markets and your account
                    </li>
                </ul>
                <p class="df-boot-footer">Getting your trading hub ready.</p>
            </div>
        </div>

        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>

</html>
